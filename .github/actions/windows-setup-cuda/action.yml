name: "Windows - Setup CUDA Toolkit"
description: "Download and extract a specific CUDA Toolkit version on Windows runners"
inputs:
  cuda_version:
    description: "CUDA Toolkit version (currently supported: 10.2, 11.7 or 12.4)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Prepare directories
      shell: pwsh
      run: |
        $target = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ inputs.cuda_version }}"
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        choco install unzip -y
        choco install 7zip -y

    - name: Install CUDA Toolkit 10.2 artifacts
      if: ${{ inputs.cuda_version == '10.2' }}
      shell: pwsh
      run: |
        $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v10.2"
        $installer = Join-Path $env:RUNNER_TEMP "cuda_10.2.89_441.22_win10.exe"
        $extractDir = Join-Path $env:RUNNER_TEMP "cuda-10.2-extract"
        $stageDir = Join-Path $env:RUNNER_TEMP "cuda-10.2-stage"
        $url = "https://developer.download.nvidia.com/compute/cuda/10.2/Prod/local_installers/cuda_10.2.89_441.22_win10.exe"

        if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
        if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
        New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
        New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

        Write-Host "Downloading $url"
        curl.exe -L $url -o $installer

        # Pass 1: unpack the self-extracting installer container.
        & 7z x -y "-o$extractDir" $installer | Out-Null

        # Seed stage with everything from pass 1, then expand nested payloads on top.
        Copy-Item -Path "$extractDir\*" -Destination $stageDir -Recurse -Force

        # Pass 2: unpack all nested .7z payload archives found in pass 1.
        $payloads = Get-ChildItem -Path $extractDir -Recurse -File -Filter *.7z -ErrorAction SilentlyContinue
        if (-not $payloads -or $payloads.Count -eq 0) {
          Write-Host "No nested .7z payloads found in CUDA 10.2 installer tree"
        } else {
          foreach ($pkg in $payloads) {
            Write-Host "Extracting payload $($pkg.FullName)"
            & 7z x -y "-o$stageDir" $pkg.FullName | Out-Null
          }
        }

        function Find-StagedNvcc([string]$searchRoot) {
          return Get-ChildItem -Path $searchRoot -Recurse -File -Filter nvcc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bin\\nvcc\.exe$' } |
            Select-Object -First 1
        }

        # Locate nvcc from the staged tree and infer toolkit root (<toolkit>\bin\nvcc.exe).
        $nvccInStage = Find-StagedNvcc $stageDir
        if (-not $nvccInStage) {
          Write-Host "nvcc.exe not found after .7z extraction; trying targeted archive fallback (.cab/.zip/.7z)"
          $fallbackArchives = Get-ChildItem -Path $extractDir -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in @('.cab', '.zip', '.7z') -and
              $_.Name -match '(?i)(nvcc|cudart|cublas|cufft|curand|cusolver|cusparse|npp|toolkit)'
            } |
            Sort-Object -Property FullName -Unique

          foreach ($archive in $fallbackArchives) {
            Write-Host "Fallback extracting $($archive.FullName)"
            & 7z x -y "-o$stageDir" $archive.FullName | Out-Null
          }
          $nvccInStage = Find-StagedNvcc $stageDir
        }
        if (-not $nvccInStage) {
          Write-Host "---- CUDA 10.2 staging diagnostics ----"
          Write-Host "Stage directory: $stageDir"
          Write-Host "Top-level entries in stage (first 60):"
          Get-ChildItem -Path $stageDir -Force -ErrorAction SilentlyContinue |
            Select-Object -First 60 -ExpandProperty FullName |
            ForEach-Object { Write-Host $_ }

          Write-Host "Entries in stage matching *nvcc* (first 40):"
          Get-ChildItem -Path $stageDir -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '(?i)nvcc' } |
            Select-Object -First 40 -ExpandProperty FullName |
            ForEach-Object { Write-Host $_ }

          Write-Host "bin directories discovered in stage (first 40):"
          Get-ChildItem -Path $stageDir -Recurse -Directory -Filter bin -ErrorAction SilentlyContinue |
            Select-Object -First 40 -ExpandProperty FullName |
            ForEach-Object { Write-Host $_ }

          throw "nvcc.exe not found in staged CUDA 10.2 payload under $stageDir"
        }

        $toolkitRoot = Split-Path -Parent (Split-Path -Parent $nvccInStage.FullName)
        Write-Host "Detected CUDA toolkit root in stage: $toolkitRoot"

        Copy-Item -Path "$toolkitRoot\*" -Destination $root -Recurse -Force

        $nvcc = Get-ChildItem -Path $root -Recurse -File -Filter nvcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $nvcc) {
          throw "nvcc.exe not found after staging/copy under $root"
        }
        $nvccDir = Split-Path $nvcc.FullName -Parent
        echo "$nvccDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        $cudaBin = Join-Path $root 'bin'
        if (Test-Path $cudaBin) {
          echo "$cudaBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
        echo "CUDA_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "CUDA_PATH_V10_2=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install CUDA Toolkit 11.7 artifacts
      if: ${{ inputs.cuda_version == '11.7' }}
      shell: pwsh
      run: |
        $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.7"
        $packages = @(
          @{ folder = "cuda_cudart"; file = "cuda_cudart-windows-x86_64-11.7.99-archive.zip" },
          @{ folder = "cuda_nvcc"; file = "cuda_nvcc-windows-x86_64-11.7.99-archive.zip" },
          @{ folder = "cuda_nvrtc"; file = "cuda_nvrtc-windows-x86_64-11.7.99-archive.zip" },
          @{ folder = "libcublas"; file = "libcublas-windows-x86_64-11.7.4.6-archive.zip" },
          @{ folder = "cuda_nvtx"; file = "cuda_nvtx-windows-x86_64-11.7.91-archive.zip" },
          @{ folder = "visual_studio_integration"; file = "visual_studio_integration-windows-x86_64-11.7.91-archive.zip" },
          @{ folder = "cuda_nvprof"; file = "cuda_nvprof-windows-x86_64-11.7.101-archive.zip" },
          @{ folder = "cuda_cccl"; file = "cuda_cccl-windows-x86_64-11.7.91-archive.zip" }
        )
        Push-Location $env:RUNNER_TEMP
        try {
          foreach ($pkg in $packages) {
            $url = "https://developer.download.nvidia.com/compute/cuda/redist/$($pkg.folder)/windows-x86_64/$($pkg.file)"
            Write-Host "Downloading $url"
            curl.exe -O $url
          }
          Get-ChildItem -Filter *.zip | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath $root -Force
          }
        } finally {
          Remove-Item *.zip -Force -ErrorAction SilentlyContinue
          Pop-Location
        }
        Get-ChildItem -Path $root -Directory | Where-Object { $_.Name -like '*-archive' } | ForEach-Object {
          $src = $_.FullName
          Copy-Item -Path "$src\*" -Destination $root -Recurse -Force
          Remove-Item $src -Recurse -Force
        }
        echo "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "$root\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "CUDA_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "CUDA_PATH_V11_7=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install CUDA Toolkit 12.4 artifacts
      if: ${{ inputs.cuda_version == '12.4' }}
      shell: pwsh
      run: |
        $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
        $packages = @(
          @{ folder = "cuda_cudart"; file = "cuda_cudart-windows-x86_64-12.4.127-archive.zip" },
          @{ folder = "cuda_nvcc"; file = "cuda_nvcc-windows-x86_64-12.4.131-archive.zip" },
          @{ folder = "cuda_nvrtc"; file = "cuda_nvrtc-windows-x86_64-12.4.127-archive.zip" },
          @{ folder = "libcublas"; file = "libcublas-windows-x86_64-12.4.5.8-archive.zip" },
          @{ folder = "cuda_nvtx"; file = "cuda_nvtx-windows-x86_64-12.4.127-archive.zip" },
          @{ folder = "cuda_profiler_api"; file = "cuda_profiler_api-windows-x86_64-12.4.127-archive.zip" },
          @{ folder = "visual_studio_integration"; file = "visual_studio_integration-windows-x86_64-12.4.127-archive.zip" },
          @{ folder = "cuda_nvprof"; file = "cuda_nvprof-windows-x86_64-12.4.127-archive.zip" },
          @{ folder = "cuda_cccl"; file = "cuda_cccl-windows-x86_64-12.4.127-archive.zip" }
        )
        Push-Location $env:RUNNER_TEMP
        try {
          foreach ($pkg in $packages) {
            $url = "https://developer.download.nvidia.com/compute/cuda/redist/$($pkg.folder)/windows-x86_64/$($pkg.file)"
            Write-Host "Downloading $url"
            curl.exe -O $url
          }
          Get-ChildItem -Filter *.zip | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath $root -Force
          }
        } finally {
          Remove-Item *.zip -Force -ErrorAction SilentlyContinue
          Pop-Location
        }
        Get-ChildItem -Path $root -Directory | Where-Object { $_.Name -like '*-archive' } | ForEach-Object {
          $src = $_.FullName
          Copy-Item -Path "$src\*" -Destination $root -Recurse -Force
          Remove-Item $src -Recurse -Force
        }
        echo "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "$root\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "CUDA_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "CUDA_PATH_V12_4=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
