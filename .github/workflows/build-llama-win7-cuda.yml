name: Build Llama Win7 CUDA (sm_61)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-llama-win7-cuda.yml'
      - '.github/actions/windows-setup-cuda/**'
      - 'build-win7-cuda-sm61.ps1'
      - 'llama.cpp/**'

permissions:
  contents: read

jobs:
  build-llama-win7-cuda:
    name: Build llama.cpp (Win7 + CUDA sm_61)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '11.7'

      - name: Configure CUDA environment
        shell: pwsh
        run: |
          $cudaPath = $env:CUDA_PATH
          if (-not $cudaPath) { throw "CUDA_PATH not set after CUDA installation." }
          if (-not (Test-Path $cudaPath)) { throw "CUDA path '$cudaPath' not found." }
          "CUDAToolkit_ROOT=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path (Join-Path $cudaPath 'bin')) {
            (Join-Path $cudaPath 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (Test-Path (Join-Path $cudaPath 'extras\CUPTI\lib64')) {
            (Join-Path $cudaPath 'extras\CUPTI\lib64') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Patch CUDA host_config for MSVC compatibility
        shell: pwsh
        run: |
          $hostCfg = Join-Path $env:CUDA_PATH 'include\crt\host_config.h'
          if (-not (Test-Path $hostCfg)) { throw "host_config.h not found at $hostCfg" }
          $raw = Get-Content -Raw -LiteralPath $hostCfg
          $patched = $raw -replace '_MSC_VER\s*>=\s*1940', '_MSC_VER >= 1950'
          if ($patched -ne $raw) {
            Set-Content -LiteralPath $hostCfg -Value $patched -Encoding UTF8
            Write-Host "Patched MSVC upper-bound check in $hostCfg"
          } else {
            Write-Host "No MSVC upper-bound pattern matched in $hostCfg; continuing"
          }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress -y

      - name: Build llama.cpp Win7 CUDA sm_61
        shell: pwsh
        run: |
          .\build-win7-cuda-sm61.ps1 -Clean -CudaArch 61 -Generator "Ninja"

      - name: Debug build outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'build-x86_64-win7\llama.cpp\cuda') {
            Get-ChildItem -Recurse -File -Path 'build-x86_64-win7\llama.cpp\cuda' -Filter *.exe | ForEach-Object {
              Write-Host $_.FullName
            }
          } else {
            Write-Host 'build directory not found: build-x86_64-win7\llama.cpp\cuda'
          }

      - name: Debug CMake logs
        if: always()
        shell: pwsh
        run: |
          $bdir = 'build-x86_64-win7\llama.cpp\cuda'
          $err = Join-Path $bdir 'CMakeFiles\CMakeError.log'
          $out = Join-Path $bdir 'CMakeFiles\CMakeOutput.log'
          if (Test-Path $err) {
            Write-Host '---- CMakeError.log (tail 200) ----'
            Get-Content $err -Tail 200
          } else {
            Write-Host "No CMakeError.log at $err"
          }
          if (Test-Path $out) {
            Write-Host '---- CMakeOutput.log (tail 120) ----'
            Get-Content $out -Tail 120
          } else {
            Write-Host "No CMakeOutput.log at $out"
          }

      - name: Bundle runtime DLLs
        shell: pwsh
        run: |
          $out = 'EVA_BACKEND\x86_64\win7\cuda\llama.cpp'
          if (-not (Test-Path $out)) { throw "Output directory missing: $out" }
          if (-not (Test-Path $env:CUDA_PATH)) { throw "CUDA_PATH missing: $env:CUDA_PATH" }

          $requiredCudaDlls = @(
            'cudart64_110.dll',
            'cublas64_11.dll',
            'cublasLt64_11.dll'
          )

          foreach ($dll in $requiredCudaDlls) {
            $src = Get-ChildItem -Path $env:CUDA_PATH -Recurse -File -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $src) { throw "Required CUDA runtime DLL missing under CUDA_PATH: $dll" }
            $src = $src.FullName
            Copy-Item $src -Destination $out -Force
            Write-Host "Bundled $dll from $src"
          }

          $optionalVcDlls = @(
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'msvcp140.dll',
            'concrt140.dll',
            'vcomp140.dll'
          )

          foreach ($dll in $optionalVcDlls) {
            $sysPath = Join-Path "$env:WINDIR\System32" $dll
            if (Test-Path $sysPath) {
              Copy-Item $sysPath -Destination $out -Force
              Write-Host "Bundled optional $dll"
            } else {
              Write-Host "Optional runtime DLL not found: $dll"
            }
          }

      - name: Verify binaries
        shell: pwsh
        run: |
          $out = 'EVA_BACKEND\x86_64\win7\cuda\llama.cpp'
          if (-not (Test-Path $out)) { throw "Output directory missing: $out" }
          if (-not (Test-Path (Join-Path $out 'llama-server.exe'))) { throw 'llama-server.exe missing' }
          if (-not (Test-Path (Join-Path $out 'llama-quantize.exe'))) { throw 'llama-quantize.exe missing' }
          if (-not (Test-Path (Join-Path $out 'mtmd.dll'))) { throw 'mtmd.dll missing' }
          if (-not (Test-Path (Join-Path $out 'llama.dll'))) { throw 'llama.dll missing' }
          if (-not (Test-Path (Join-Path $out 'ggml.dll'))) { throw 'ggml.dll missing' }
          if (-not (Test-Path (Join-Path $out 'ggml-base.dll'))) { throw 'ggml-base.dll missing' }
          if (-not (Test-Path (Join-Path $out 'cudart64_110.dll'))) { throw 'cudart64_110.dll missing' }
          if (-not (Test-Path (Join-Path $out 'cublas64_11.dll'))) { throw 'cublas64_11.dll missing' }
          if (-not (Test-Path (Join-Path $out 'cublasLt64_11.dll'))) { throw 'cublasLt64_11.dll missing' }

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path 'EVA_BACKEND\x86_64\win7\cuda\llama.cpp' -DestinationPath 'artifacts/llama-win7-cuda-sm61.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-win7-cuda-sm61
          path: artifacts/llama-win7-cuda-sm61.zip
          if-no-files-found: error
